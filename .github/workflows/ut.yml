name: iMiner python tests

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Dependencies
        run: |
          source $CONDA/bin/activate
          $CONDA/bin/conda update -n base -c defaults conda
          conda install pip
          conda update pip
          conda install tqdm numpy pandas acpype pytest pytest-xdist rdkit biopandas openbabel plip -c conda-forge
      - name: Install iMiner
        run: |
          source $CONDA/bin/activate
          python setup.py install
      - name: Run Tests
        run: |
          source $CONDA/bin/activate
          pytest -vs tests/  