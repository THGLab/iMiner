rl_params:
  algorithm: ppo
  epsilon: 0.1
  entropy_coef: 0.05
  n_epochs_before_resample: 10
  kl_threshold: 0.03

optimizer_specs:
  optimizer: adam
  learning_rate: 1.0e-4

training_specs:
  batch_size: 1024
  n_seq_per_iter: 1500 # for debug
  n_iters: 200 # for debug
#  start_iter : 
  prior_diff_coef: 0
  prior_model: /global/scratch/users/ozhang/covid/rl_dataset/final_model.pkl  
  starting_policy_model: /global/scratch/users/ozhang/covid/rl_dataset/final_model.pkl  
#  model_weights: /global/scratch/users/ozhang/covid/ZikvPro/active_interaction/models/model_40

rewards:
  - type: vina_score
    weight: 2
    params:
      protein_file:  /global/scratch/users/ozhang/covid/rdkit_vina/ns3_protease.pdbqt
      box: [-21, 5.5, -24, -3, 22.5, 0]
      use_gpu: True
      timeout: 60
      #fragment: ["Cc2cc(N)c1cccc(Cl)c1n2", [-13.79580109,  15.63052044, -17.64702725]]
  - type: interaction # need to be listed right after vina
    weight: 1
    params:
      protein_path: /global/scratch/users/ozhang/covid/ZikvPro/ns3_protease.pdb
      # interaction types supported: hydrogen_bond, hydrophobic_interaction, pi_stack, salt_bridge, halogen_bond
      key_residues: ["SER/81/A", "ASP/83/A", "ASP/75/B", "HIS/51/B", "GLY/151/B", "GLY/153/B",
                   "SER/135/B", "TYR/161/B", "TYR/130/B", "ASP/129/B", "VAL/154/B"]
#  - type: fragment_similarity
#    weight: 2
#    params:
#      fragments: ['CNc1cc(C)nc2c(Cl)cccc12']
#      weights: [1]
#      global_substructure_match: True
  - type: drug_likeliness
    weight: 2

run:
  random_seed: 42
  output_dir: /global/scratch/users/ozhang/covid/ZikvPro/active_update