rl_params:
  algorithm: ppo
  epsilon: 0.12
  entropy:
    init_coeff: 0.15
  n_epochs_before_resample: 10
  kl_threshold: 0.03

optimizer_specs:
  optimizer: adam
  learning_rate: 1.0e-4

training_specs:
  batch_size: 1024
  n_seq_per_iter: 20 # for debug, run 800+ molecules for production
  n_iters: 10 # for debug
  start_iter : 0
  prior_diff_coef: 0
  prior_model: /global/scratch/users/ozhang/covid/rl_dataset/final_model.pkl  
  starting_policy_model: /global/scratch/users/ozhang/covid/MPro/WJ_frag_pretrain/pretrained.pkl # loading pretrained model
  model_weights: /global/scratch/users/ozhang/covid/MPro/WJ_frag_pretrain/checkpoint_24.pth # loading pretrained weights or resume from previous model weights

rewards:
  - type: docking
    weight: 2
    params:
      protein_file: /global/scratch/users/ozhang/covid/MPro/WJ_mpro.pdbqt
      box: [42.5, 34, 63, 66.5, 58, 87] # [-21, 5.5, -24, -3, 22.5, 0] # [47, 64, 12, 65, 82, 35]
      protocols: ["vina-gpu"]
      timeout: 45
      fragment: 
        fragment_path: /global/scratch/users/ozhang/covid/MPro/WJ_lig_align.sdf
#        similarity_threshold: 0.2 optional args that rejects molecules with fragment similarity lower
#        distance_threshold: 0.8 optional args that rejects molecules with shape alignment distance higher
#  - type: interaction # need to be listed right after vina
#    weight: 5
#    params:
#      protein_path: /global/scratch/users/ozhang/covid/MPro/WJ_mpro.pdb
#        interaction types supported: hydrogen_bond, hydrophobic_interaction, pi_stack, pi_cation_interaction, salt_bridge, halogen_bond
#      key_residues: ["hydrogen_bond/HIS/163/A"]
#, "hydrogen_bond/GLY/143/A", "hydrogen_bond/SER/144/A", "hydrogen_bond/CYS/145/A", "pi-stack/HIS/41/A", "hydrogen_bond/GLU/166/A"] 
#      coef: (optional, by ones by default)
#      backbone: (optional)
  - type: fragment_similarity
    weight: 4
    params:
      fragments: ["O=c1ccccn1-c1cccnc1"] #, "COc4cc(Cl)cc(c3cc(c1ccccc1C#N)cn(c2cccnc2)c3=O)c4", "COc4cc(Cl)cc(c3cc(c1c[nH]c(=O)[nH]c1=O)cn(c2cccnc2)c3=O)c4"] 
#      weights: [0.2, 0.4, 0.4]
#  - type: pharmacophore
#    weight: 2
#    params:
#      query: /global/scratch/users/ozhang/covid/MPro/WJ_moles.csv
  - type: drug_likeliness
    weight: 1

run:
  random_seed: 42
  output_dir: /global/scratch/users/ozhang/covid/MPro/test
